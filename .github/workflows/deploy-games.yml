name: Publish verified game site
on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-games.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: verified-game-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: site
      - name: Verify required runtime files
        run: |
          test -s site/Project-A/src/settings.json
          test -s site/Project-B/src/settings.json
          test -f site/.nojekyll
          test -s site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
