name: Publish verified game site
on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-games.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: verified-game-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: site
      - name: Verify required runtime files
        run: |
          test -f site/.nojekyll
          test -s site/index.html
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('site')
          manifest = json.loads((root / '.pages-package.json').read_text())
          assert manifest['format'] == 1 and manifest['projects']
          for project in manifest['projects']:
              directory = root / project['project']
              assert directory.parent == root and directory.name.startswith('Project-')
              for name in ['index.html', 'frontend-launch.js', f"assets/{project['bundle']}/config.json"]:
                  assert (directory / name).stat().st_size > 0, str(directory / name)
              for name, field in [('application.js', 'applicationSha256'), ('src/settings.json', 'settingsSha256')]:
                  assert hashlib.sha256((directory / name).read_bytes()).hexdigest() == project[field], str(directory / name)
          print(f"Verified {len(manifest['projects'])} packaged game builds")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
