<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>遊戲預覽</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#101318;color:#f2f3f5}
    *{box-sizing:border-box}body{margin:0;padding:64px 24px}main{max-width:820px;margin:auto}
    .eyebrow{font-size:13px;letter-spacing:.12em;color:#bcaa7d}h1{font-size:clamp(30px,5vw,44px);font-weight:650;letter-spacing:.02em;margin:12px 0}
    .intro{color:#b0b8c4;line-height:1.7;margin:0 0 36px}.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
    article{padding:28px;background:#191f28;border:1px solid #343c49;border-radius:16px}.number{font-size:13px;color:#bcaa7d}h2{font-size:26px;margin:26px 0 12px}
    article p{color:#b0b8c4;font-size:14px;line-height:1.6;margin:0 0 28px}a{color:inherit;text-decoration:none}
    .play{display:block;text-align:center;background:#ecdba8;color:#17191e;padding:14px;border-radius:8px;font-weight:650}
    .layouts{display:flex;justify-content:center;gap:28px;margin-top:20px;font-size:14px;color:#c7ced7}.layouts a:hover{text-decoration:underline}
    a:focus-visible{outline:3px solid #e7be65;outline-offset:5px}footer{margin-top:32px;color:#8993a2;font-size:13px;line-height:1.8}
    @media(max-width:580px){body{padding:36px 20px}.games{grid-template-columns:1fr}article{padding:24px}h2{margin-top:16px}}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BROWSER GAMES</div>
    <h1>選擇遊戲</h1>
    <p class="intro">使用電腦或手機開啟，選擇一款開始體驗。</p>
    <div class="games">
      <article aria-labelledby="project-a">
        <span class="number">01</span>
        <h2 id="project-a">Project-A</h2>
        <p>依照螢幕尺寸，自動選擇適合的遊戲版型。</p>
        <a class="play" href="./Project-A/" aria-label="開始 Project-A">開始遊戲</a>
        <div class="layouts"><a href="./Project-A/?layout=desktop" aria-label="Project-A 電腦版">電腦版</a><a href="./Project-A/?layout=mobile" aria-label="Project-A 手機開啟">手機開啟</a></div>
      </article>
      <article aria-labelledby="project-b">
        <span class="number">02</span>
        <h2 id="project-b">Project-B</h2>
        <p>保留橫向盤面，手機亦可直接開啟遊玩。</p>
        <a class="play" href="./Project-B/" aria-label="開始 Project-B">開始遊戲</a>
        <div class="layouts"><a href="./Project-B/?layout=desktop" aria-label="Project-B 電腦版">電腦版</a><a href="./Project-B/?layout=mobile" aria-label="Project-B 手機開啟">手機開啟</a></div>
      </article>
    </div>
    <footer>模擬遊戲，僅供展示。進度與模擬點數儲存在目前的瀏覽器。</footer>
  </main>
</body>
</html>
